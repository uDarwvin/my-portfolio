<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--bootstrap css-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!--bootstrap icon-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!--font awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <!--style css-->
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="container">
        <div class="list-card">
            <div class="header">
                <h4 class="weight-900">کارهای من</h4>
                <p>کار های روزانه ات را مدیریت کن</p>
            </div>
            <div class="px-4 pt-5 pb-3">
                <div id="form">
                    <input type="text" placeholder="یک کار جدید بنویس">
                    <button class="add-button" type="submit">افزودن</button>
                </div>
                <p class="status">هنوز کاری ثبت نشده</p>
                <hr>
                <div class="text-center">
                    <p class="list-is-empty my-5"><i class="bi bi-card-checklist fs-5"></i> لیست شما خالی است — اولین کار را اضافه کنید!</p>
                    <ul class="list">
                    </ul>
                </div>
                <button class="remove-all">پاک کردن همه</button>
            </div>
        </div>
    </div>

    <!--bootstrap js-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!--script js-->
    <script src="js/index.js"></script>
</body>
</html>
